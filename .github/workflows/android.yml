# Cria o APK do Lucky Verities (Android, landscape) nos servidores do GitHub.
#
#   - "Run workflow" (separador Actions)  -> o APK fica em "Artifacts" no fim da execucao.
#   - "git push" de uma tag vX.Y.Z        -> alem disso, o APK e anexado a Release dessa tag.
#
# A 1a execucao demora ~40-60 min (compila o Python e o pygame-ce para ARM); as seguintes usam a cache.
name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numero da versao (vX.Y.Z) a escrever no APK; vazio = build de teste, sem atualizacoes automaticas"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:                     # o Gradle do python-for-android precisa do JDK 17
          distribution: temurin
          java-version: "17"

      - name: Instalar as dependencias do buildozer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev ccache
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      # O SDK/NDK e os recipes compilados sao alguns GB: sem cache cada build volta a descarregar tudo.
      - name: Cache do SDK / NDK / p4a
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          # O nome da repo entra na chave: o que esta em cache guarda caminhos absolutos
          # (/home/runner/work/<repo>/<repo>/...), por isso uma cache feita com outro nome de repo
          # rebenta o build ("No such file or directory: .../hostpython3/native-build/.../pip3").
          key: buildozer-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('buildozer.spec', 'android/p4a-recipes/**') }}
          restore-keys: buildozer-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Escrever a versao no jogo (nas tags, ou a pedido)
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            V="$GITHUB_REF_NAME"
          elif [[ "$INPUT_VERSION" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            # "Run workflow" com um numero de versao: serve para refazer o APK de uma Release que ja
            # existe (sem isto o APK ficaria com BUILD_VERSION "dev" e nunca se atualizaria sozinho).
            V="$INPUT_VERSION"
          fi
          if [ -n "$V" ]; then
            printf 'BUILD_VERSION = "%s"\n' "$V" > build_version.py
            sed -i "s/^version = .*/version = ${V#v}/" buildozer.spec
          fi

      # A cache guarda o pygame ja compilado: se a recipe mudar, e preciso deita-lo fora
      # ou o build reaproveita o .so antigo e a correcao nunca chega ao APK.
      - name: Recompilar o pygame se a recipe mudou
        shell: bash
        run: |
          H=$(cat <(find android/p4a-recipes -type f -exec sha256sum {} + | sort) .github/workflows/android.yml | sha256sum | cut -d" " -f1)
          M=.buildozer/p4a-recipes.hash
          if [ "$(cat "$M" 2>/dev/null)" != "$H" ]; then
            echo "Recipes mudaram: a apagar o pygame compilado."
            rm -rf .buildozer/android/platform/build-*/build/other_builds/pygame*
            rm -rf .buildozer/android/platform/build-*/build/python-installs/*/*/pygame*
            rm -rf .buildozer/android/platform/build-*/packages/pygame
            # sem apagar a dist, o p4a limita-se a reempacotar o que ja tinha
            rm -rf .buildozer/android/platform/build-*/dists
            mkdir -p .buildozer && printf '%s' "$H" > "$M"
          fi

      # O APK de debug e assinado com a ~/.android/debug.keystore. Se cada build gerar uma chave nova,
      # o telemovel recusa a atualizacao ("signatures do not match") e e preciso desinstalar o jogo,
      # o que apaga os saves. Guardar a chave na cache mantem a assinatura igual entre builds.
      - name: Cache da chave de debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Criar a chave de debug se ainda nao existir
        shell: bash
        run: |
          KS=~/.android/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p ~/.android
            # Os mesmos valores que o SDK do Android usa por omissao para a chave de debug.
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$KS" -storepass android | grep -i sha256 || true

      - name: Criar o APK
        run: buildozer android debug
        env:
          # O gradle assina o APK de debug com $ANDROID_SDK_HOME/.android/debug.keystore. Sem isto
          # o ANDROID_SDK_HOME aponta para dentro do ~/.buildozer, que nao vai para a cache: cada
          # build assinava com uma chave nova, o telemovel recusava a atualizacao ("signatures do
          # not match") e era preciso desinstalar o jogo, o que apaga os saves.
          ANDROID_SDK_HOME: /home/runner

      - uses: actions/upload-artifact@v4
        with:
          name: Lucky-Verities-Android.apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Anexar a Release (so nas tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls bin/*.apk | head -1)"
          cp "$APK" "Lucky-Verities-Android.apk"
          gh release upload "$GITHUB_REF_NAME" "Lucky-Verities-Android.apk" --clobber
