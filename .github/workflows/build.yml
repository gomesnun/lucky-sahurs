# Cria os executaveis do Lucky Verities para Windows, Linux e macOS (Apple Silicon + Intel)
# e publica-os numa "Release" do GitHub, de onde os amigos descarregam.
#
# Desde a v2.5.0 os executaveis sao a versao em Rust (a raiz do repositorio): o mesmo jogo, mais rapido.
# Os ficheiros da Release tem os MESMOS nomes de sempre (Lucky-Verities-Windows.exe, ...), por isso
# quem ainda tem a versao em Python e atualizado sozinho para a versao em Rust (ver online/updater.py).
# Os saves ficam na mesma pasta, nao se perde nada. O APK de Android continua em Python (python/, android.yml).
#
# COMO USAR
#   1) Publicar uma versao:   git tag v2.5.0 && git push origin v2.5.0
#      (ou no GitHub: Releases > Draft a new release > criar a tag v2.5.0 > Publish)
#      -> constroi os 4 ficheiros e anexa-os a Release dessa tag.
#      O numero TEM de ser maior que o da ultima Release, senao ninguem e atualizado.
#   2) So testar o build:     separador Actions > "Build Lucky Verities" > Run workflow
#      -> os ficheiros ficam em "Artifacts" no fim da execucao (sem criar Release).
#
# CODIGO PRIVADO + RELEASES PUBLICAS (os amigos descarregam sem conta e nao veem o codigo)
#   Por omissao a Release e criada nesta mesma repo. Para a criar noutra repo (publica, so com os executaveis):
#     - Settings > Secrets and variables > Actions > separador Variables:  RELEASES_REPO = TEU-USER/lucky-verities-releases
#     - separador Secrets:  RELEASES_TOKEN = um token com permissao "Contents: Read and write" nessa repo
#   Sem estas duas definicoes, tudo funciona como antes (Release nesta repo).
#
# QUOTA (repo privada): 2000 min/mes; Windows conta 2x e macOS 10x.
#   Para gastar menos, apaga a linha do "macOS (Intel)" na lista de baixo (poupa cerca de metade).

name: Build Lucky Verities

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # se um sistema falhar, os outros continuam
      matrix:
        include:
          - { name: "Windows",                os: windows-latest, asset: "Lucky-Verities-Windows.exe" }
          - { name: "Linux",                  os: ubuntu-24.04,   asset: "Lucky-Verities-Linux.tar.gz" }
          - { name: "macOS (Apple Silicon)",  os: macos-latest,   asset: "Lucky-Verities-macOS-AppleSilicon.zip" }
          # macos-15-intel e o ultimo runner Intel do GitHub (disponivel ate agosto de 2027).
          - { name: "macOS (Intel)",          os: macos-15-intel, asset: "Lucky-Verities-macOS-Intel.zip" }

    env:
      # Bibliotecas em C que vao DENTRO do executavel (um so ficheiro, como o --onefile do PyInstaller).
      # Sao as mesmas versoes com que o jogo foi comparado pixel a pixel com a versao em Python.
      SDL2_VERSION: "2.32.10"
      SDL2_SHA256: "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"
      FREETYPE_VERSION: "2.14.3"
      FREETYPE_SHA256: "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
      HARFBUZZ_VERSION: "14.2.1"
      HARFBUZZ_SHA256: "a54a5d8e9380a41fbb762ce367bcbf7704792dfca0d93f1bbca86c5a57902e0e"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TERM_COLOR: never

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # O SDL carrega o X11 / Wayland / som do sistema quando o jogo abre; so precisa dos cabecalhos para compilar.
      - name: Dependencias de compilacao (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      # Escreve o numero da versao (a tag, ex.: v2.5.0) dentro do jogo. E com ele que o jogo sabe que versao e e
      # se ha uma mais nova. So numa tag vX.Y.Z; num "Run workflow" fica "dev" (esse programa nao pede atualizacoes).
      - name: Guardar o numero da versao no jogo
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            V="$GITHUB_REF_NAME"
          else
            V="dev"
          fi
          echo "LV_BUILD_VERSION=$V" >> "$GITHUB_ENV"
          echo "Versao deste build: $V"

      - name: Descarregar SDL2, FreeType e HarfBuzz (com verificacao SHA-256)
        shell: bash
        run: |
          mkdir -p deps && cd deps
          get() {  # url ficheiro sha256
            curl -fsSL --retry 3 -o "$2" "$1"
            got=$(cmake -E sha256sum "$2" | cut -d' ' -f1)
            if [ "$got" != "$3" ]; then echo "::error::SHA-256 errado para $2 ($got)"; exit 1; fi
            cmake -E tar xf "$2"
          }
          get "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz" sdl2.tar.gz "$SDL2_SHA256"
          get "https://download.savannah.gnu.org/releases/freetype/freetype-$FREETYPE_VERSION.tar.xz" freetype.tar.xz "$FREETYPE_SHA256"
          get "https://github.com/harfbuzz/harfbuzz/releases/download/$HARFBUZZ_VERSION/harfbuzz-$HARFBUZZ_VERSION.tar.xz" harfbuzz.tar.xz "$HARFBUZZ_SHA256"

      - name: Compilar o SDL2 (biblioteca estatica)
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="-DSDL_FORCE_STATIC_VCRT=ON"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-G Ninja"; fi
          cmake -S "deps/SDL2-$SDL2_VERSION" -B deps/sdl-build $EXTRA \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
            -DSDL_STATIC_PIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/deps/sdl-prefix"
          cmake --build deps/sdl-build --config Release --parallel
          cmake --install deps/sdl-build --config Release

      - name: Compilar o jogo
        shell: bash
        env:
          LV_STATIC: "1"
        run: |
          W="$GITHUB_WORKSPACE"
          export LV_SDL2_PREFIX="$W/deps/sdl-prefix"
          export LV_FT_SRC="$W/deps/freetype-$FREETYPE_VERSION"
          export LV_HB_SRC="$W/deps/harfbuzz-$HARFBUZZ_VERSION"
          export RUSTFLAGS="-L native=$W/deps/sdl-prefix/lib"
          # Windows: o runtime do C tambem vai dentro do .exe (nao precisa do "Visual C++ Redistributable")
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="$RUSTFLAGS -C target-feature=+crt-static"; fi
          cargo build --release --locked --features static
          cargo test --release --locked --features static updater

      # Antes de publicar: o executavel tem de arrancar e mostrar a versao certa (sem janela, sem som).
      - name: Testar o executavel
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LUCKY_VERITIES_NO_UPDATE: "1"
        run: |
          EXE=target/release/lucky-verities
          [ "$RUNNER_OS" = "Windows" ] && EXE="$EXE.exe"
          mkdir -p shots-test
          LUCKY_VERITIES_SAVE_DIR="$PWD/shots-save" "$EXE" --shots shots-test
          ls shots-test | wc -l

      # ---------------------------------------------------------------- Windows: um unico .exe com o icone do Verity
      - name: Criar o .exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/lucky-verities.exe "dist/${{ matrix.asset }}"

      # ---------------------------------------------------------------- Linux: um unico binario dentro de um .tar.gz
      # (o .tar.gz guarda a permissao de executavel, que um upload simples perderia)
      - name: Criar o binario (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/lucky-verities dist/LuckyVerities
          chmod 755 dist/LuckyVerities
          tar -czf "dist/${{ matrix.asset }}" -C dist LuckyVerities

      # ---------------------------------------------------------------- macOS: uma .app com o icone do Verity, dentro de um .zip
      # (o "ditto" e o que o proprio macOS usa para comprimir: preserva permissoes e ligacoes da .app)
      - name: Criar a .app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Lucky Verities.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/lucky-verities "$APP/Contents/MacOS/Lucky Verities"
          cp icons/verity.icns "$APP/Contents/Resources/verity.icns"
          V="${LV_BUILD_VERSION#v}"; [ "$V" = "dev" ] && V="0.0.0"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Lucky Verities</string>
            <key>CFBundleDisplayName</key><string>Lucky Verities</string>
            <key>CFBundleExecutable</key><string>Lucky Verities</string>
            <key>CFBundleIdentifier</key><string>Lucky Verities</string>
            <key>CFBundleIconFile</key><string>verity.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$V</string>
            <key>CFBundleVersion</key><string>$V</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 2           # em repos privadas o espaco para ficheiros e so 500 MB

  # Só corre quando o disparo foi uma tag "v*" (não no "Run workflow" manual).
  release:
    name: Publicar a Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write             # necessario para criar a Release e anexar os ficheiros
    env:
      # Sem RELEASES_REPO / RELEASES_TOKEN: publica nesta repo. Com eles: publica na repo publica indicada.
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
      GH_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      SOURCE_REPO: ${{ github.repository }}
      HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Verificar a configuracao
        run: |
          echo "A publicar a Release em: $GH_REPO"
          if [ "$GH_REPO" != "$SOURCE_REPO" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::RELEASES_REPO esta definido mas falta o segredo RELEASES_TOKEN (ver o topo do build.yml)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true    # todos os ficheiros ficam juntos na pasta "release"

      # O jogo procura na Release o ficheiro com o nome que ESSA versao conhece (ver online/updater.py).
      # Quem ainda esta na v2.0.0 ou anterior procura "Lucky-Sahurs-*": sem estas copias, a atualizacao
      # automatica para a versao com o nome novo falhava e era preciso descarregar a mao.
      - name: Copias com o nome antigo (para quem ainda tem o Lucky Sahurs instalado)
        run: |
          for f in release/Lucky-Verities-*; do
            cp "$f" "release/$(basename "$f" | sed 's/^Lucky-Verities-/Lucky-Sahurs-/')"
          done

      - name: Criar ou atualizar a Release
        run: |
          ls -l release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Lucky Verities $TAG" \
              --notes "Descarrega o ficheiro do teu sistema: Windows (.exe), Linux (.tar.gz) ou macOS (.zip). Quem ja tem o jogo instalado e atualizado automaticamente."
          fi
