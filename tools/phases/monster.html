<!doctype html><html><body style="margin:0;background:transparent">
<!-- Phase 4 (Monster) art: the 3D monster model, recoloured per verity; tools/phases/monster.mjs drives it.
     Serve the repo root with any static server, with three.js installed in tools/phases/node_modules (npm i three@0.169). -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const S = 512;
const r = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
r.setSize(S, S); r.setClearColor(0, 0); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2, 4, 4); scene.add(key);
const gltf = await new GLTFLoader().loadAsync('../../verity_variants/verity_monster_normal.glb');
const root = gltf.scene; scene.add(root);
const mixer = new THREE.AnimationMixer(root);
mixer.clipAction(gltf.animations.find(c => c.name === 'Idle')).play(); mixer.setTime(0.35);
root.updateMatrixWorld(true);
let mesh; root.traverse(o => { if (o.isMesh) mesh = o; });
// the skin texture recoloured per verity: its shading (luminance) in the verity's colour; teeth, gums and eyes
// (low-saturation whites, reds) keep their own colours so the face stays the model's face
const img = mesh.material.map.image, cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
const src = cx.getImageData(0, 0, cv.width, cv.height);
const tex = new THREE.CanvasTexture(cv); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
const mat = new THREE.MeshStandardMaterial({map: tex, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide, alphaTest: 0.3});
mesh.material = mat;
function recolor(rgb) {
  const out = cx.createImageData(cv.width, cv.height), a = src.data, o = out.data;
  const [R, G, B] = rgb, lumC = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
  for (let i = 0; i < a.length; i += 4) {
    const r = a[i], g = a[i + 1], b = a[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx ? (mx - mn) / mx : 0, red = r > g * 1.9 && r > b * 1.5 && r > 110;
    o[i + 3] = a[i + 3];
    if ((sat < 0.15 && mx > 185) || red) { o[i] = r; o[i + 1] = g; o[i + 2] = b; continue; }
    // skin: 0..1 shading from the yellow texture, re-applied on the verity colour (dark colours lifted a bit)
    const l = Math.min(1.25, (0.299 * r + 0.587 * g + 0.114 * b) / 190);
    const lift = lumC < 0.25 ? 45 : 0;
    o[i] = Math.min(255, R * l + lift); o[i + 1] = Math.min(255, G * l + lift); o[i + 2] = Math.min(255, B * l + lift);
  }
  cx.putImageData(out, 0, 0); tex.needsUpdate = true;
}
const box = new THREE.Box3().setFromObject(root), sz = box.getSize(new THREE.Vector3()), ct = box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(22, 1, 0.01, 1000);
// fit the figure where the ball sits in every verity image (ui/cards.rs BALL_FRAC / BALL_CY): 0.23..0.86 of the height
const FILL = 0.63, CENTER = 0.545;
const dist = sz.y / (2 * Math.tan(THREE.MathUtils.degToRad(11))) / FILL;
const aimY = ct.y + (CENTER - 0.5) / FILL * sz.y;
cam.position.set(ct.x + dist * 0.22, aimY + sz.y * 0.05, ct.z + dist); cam.lookAt(ct.x, aimY, ct.z);
cam.updateMatrixWorld(); cam.updateProjectionMatrix();
window.renderColor = (rgb) => { recolor(rgb); r.render(scene, cam); return r.domElement.toDataURL('image/png'); };
window.done = true;
</script></body></html>
